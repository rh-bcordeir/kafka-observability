apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  generation: 1
  labels:
    strimzi.io/cluster: kafka-cluster
  name: broker
  namespace: kafka
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 150Gi
        deleteClaim: true
        kraftMetadata: shared