apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: my-cluster
spec:
  kafkaExporter:
      groupRegex: ".*"  
      topicRegex: ".*" 
      groupExcludeRegex: "^excluded-.*"  
      topicExcludeRegex: "^excluded-.*" 
      showAllOffsets: false  
      resources:  
        requests:
          cpu: 200m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
      logging: debug  8 
      enableSaramaLogging: true  
      template: 
        pod:
          metadata:
            labels:
              label1: value1
          imagePullSecrets:
            - name: my-docker-credentials
          terminationGracePeriodSeconds: 120
      readinessProbe: 
        initialDelaySeconds: 15
        timeoutSeconds: 5
      livenessProbe: 
        initialDelaySeconds: 15
        timeoutSeconds: 5